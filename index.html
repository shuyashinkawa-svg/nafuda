<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>名札スキャン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   名札スキャン — 画面仕様書（案A・ライトのみ・390×844px基準）に準拠
   色はこの4つだけ：
     #FFFFFF 背景 / #101112 文字・境界 / #6A6B6E 副文字 / #007FB0 列番号
   やらないこと：影・ぼかし・グラデーション・角丸・列番号以外への着色
   =========================================================== */
:root{
  color-scheme: light;
  --paper:#FFFFFF;
  --ink:#101112;
  --sub:#6A6B6E;
  --accent:#007FB0;
  --camoff:#EDEBE6;
  --camofftext:#9A9891;
  --dash:#D8D6D0;
  --press:#2B2F36;
  --rowpress:#F3F1EC;
  --hair:#E0DED8;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, Meiryo, system-ui, sans-serif;
  --num: "Inter", system-ui, sans-serif;
}
*{box-sizing:border-box; border-radius:0 !important;}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer;}
[hidden]{display:none !important;}

/* ---------- 作業画面：スクロールさせない ---------- */
body.work{overflow:hidden;}
#work{
  height:100dvh; display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top, 0px);
}

/* ヘッダー 46px */
#hd{
  flex:0 0 46px; height:46px; display:flex; align-items:center;
  justify-content:space-between; padding:0 0 0 20px;
  border-bottom:1px solid var(--ink);
}
#hdleft{font-family:var(--mono); font-size:11px; color:var(--sub); letter-spacing:.02em;}
#menubtn{
  width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--ink); letter-spacing:.14em;
}

/* カメラの場所：480px（④では340px）。844pxより低い端末ではここが先に縮む */
#cam{
  /* 映像480px ＋ 下境界2px ＝ 482px。結果ブロックは残り316pxになる */
  position:relative; flex:1 1 482px; max-height:482px; min-height:0;
  background:var(--camoff); overflow:hidden; border-bottom:2px solid var(--ink);
}
#work[data-state="pick"] #cam{flex-basis:342px; max-height:342px;}
#video{width:100%; height:100%; object-fit:cover; display:block; background:#000;}
#work[data-state="pre"] #video{display:none;}
#camoff{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10px; letter-spacing:.24em; color:var(--camofftext);
}
#work:not([data-state="pre"]) #camoff{display:none;}

/* 読取枠：左右22px・上165px・高さ150px・白2px。④では上95px */
#frame{position:absolute; left:22px; right:22px; top:165px; height:150px; border:2px solid #fff;}
#work[data-state="pick"] #frame{top:95px;}
#work[data-state="pre"] #frame{display:none;}
/* 枠外は黒55%の単色ベタ4枚（グラデーション不可） */
.mask{position:absolute; background:rgba(0,0,0,.55);}
#work[data-state="pre"] .mask{display:none;}
/* 走査線：唯一のアニメーション。確定したら止める */
#scanline{
  position:absolute; left:0; right:0; top:0; height:2px; background:#fff; opacity:.8;
  animation:sweep 1.1s linear infinite alternate;
}
@keyframes sweep{ from{ top:0; } to{ top:calc(100% - 2px); } }
#work:not([data-state="scan"]) #scanline{display:none;}
#guide{
  position:absolute; left:0; right:0; top:331px; text-align:center;
  font-size:12px; color:#fff; letter-spacing:.08em;
}
#work:not([data-state="scan"]) #guide{display:none;}

/* 結果ブロック：残り全部。左右パディング18px、縦横中央 */
#res{flex:1 1 auto; min-height:0; position:relative; padding:0 18px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
#work[data-state="pick"] #res{padding:0; justify-content:flex-start;}

/* ① 起動前 */
#pre{width:100%; height:100%; display:flex; flex-direction:column;
     align-items:stretch; text-align:left; padding:0 2px;}
#pre .ready{font-family:var(--mono); font-size:11px; color:var(--sub); letter-spacing:.14em; margin-top:22px;}
#pre .lead{font-size:16px; line-height:1.8; margin-top:14px;}
#pre .spacer{flex:1 1 auto;}
#startbtn{
  height:76px; width:100%; background:var(--ink); color:#fff;
  font-size:18px; font-weight:700; margin-bottom:20px; display:flex;
  align-items:center; justify-content:center;
}
#startbtn:active{background:var(--press);}
#startbtn[disabled]{background:var(--press); cursor:default;}
#prenote{font-size:16px; text-align:center; margin-bottom:20px; min-height:76px;
  display:flex; align-items:center; justify-content:center;}

/* ②③ 列番号のかたまり */
.colnum{
  font-family:var(--num); font-weight:700; font-size:140px; line-height:.9;
  letter-spacing:-.05em; font-variant-numeric:tabular-nums;
  display:flex; align-items:baseline; justify-content:center;
}
.colnum .unit{font-size:36px; font-weight:700; margin-left:4px; font-family:var(--sans); letter-spacing:0;}
#live .colnum{color:var(--dash);}
#hit .colnum{color:var(--accent);}
#live .total{font-family:var(--mono); font-size:13px; color:var(--sub); margin-top:34px;}
#hit .who{font-size:36px; font-weight:700; line-height:1.25; letter-spacing:.01em; margin-top:18px;}
#hit .prog{font-family:var(--mono); font-size:15px; color:var(--sub); margin-top:18px;}
#hit .prog .done{font-size:11px; margin-left:8px;}

/* ④ 候補 */
#pick{width:100%; height:100%; display:flex; flex-direction:column;}
#pick .lead{font-family:var(--mono); font-size:11px; color:var(--sub);
  padding:12px 20px; border-bottom:1px solid var(--ink); text-align:left;}
#pick .rows{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}
.cand{
  flex:1 1 0; min-height:88px; display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; border-bottom:1px solid var(--ink); width:100%; text-align:left;
}
.cand:active{background:var(--rowpress);}
.cand .nm{font-size:28px; font-weight:700;}
.cand .cl{font-family:var(--num); font-weight:700; font-size:50px; color:var(--accent);
  display:flex; align-items:baseline; font-variant-numeric:tabular-nums;}
.cand .cl span{font-size:18px; font-family:var(--sans); margin-left:2px; font-weight:700;}
#pick .foot{flex:0 0 56px; height:56px; display:flex; align-items:center; justify-content:center;
  font-size:13px; color:var(--sub);}

/* ---------- ⑤ 補助画面（全画面） ---------- */
#sheet{
  position:fixed; inset:0; background:var(--paper); z-index:10;
  display:flex; flex-direction:column; padding-top:env(safe-area-inset-top, 0px);
}
#sheet header{
  flex:0 0 46px; height:46px; display:flex; align-items:center; justify-content:space-between;
  padding:0 16px 0 20px; border-bottom:2px solid var(--ink);
}
#sheet header .ttl{font-family:var(--mono); font-size:11px; color:var(--sub); letter-spacing:.06em;}
#sheet header button{font-size:13px; padding:10px 4px;}
#sheetbody{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;}

.menurow{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:22px 20px; border-bottom:1px solid var(--ink); text-align:left;
}
.menurow:active{background:var(--rowpress);}
.menurow .t{display:block; font-size:20px; font-weight:700; line-height:1.3;}
.menurow .s{display:block; font-size:13px; color:var(--sub); margin-top:2px; line-height:1.4;}
.menurow .arrow{font-size:20px;}
.note{font-size:13px; color:var(--sub); padding:20px; line-height:1.7;}
.blockbtn{width:calc(100% - 40px); margin:0 20px 24px; height:56px; border:1px solid var(--ink);
  display:flex; align-items:center; justify-content:center; font-size:15px;}
.blockbtn:active{background:var(--rowpress);}

#q{width:calc(100% - 40px); margin:20px; height:56px; padding:0 16px; font-size:17px;
   border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:var(--sans);}
.qhint{font-size:13px; color:var(--sub); padding:0 20px 14px;}
.hitrow{width:100%; display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; border-top:1px solid var(--ink); min-height:92px; text-align:left;}
.hitrow:active{background:var(--rowpress);}
.hitrow .nm{font-size:22px; font-weight:700;}
.hitrow .cl{font-family:var(--num); font-weight:700; font-size:38px; color:var(--accent);
  display:flex; align-items:baseline;}
.hitrow .cl span{font-size:15px; font-family:var(--sans); margin-left:2px;}

.tabs{display:flex; border-bottom:1px solid var(--ink);}
.tabs button{flex:1 1 0; height:48px; font-size:15px; font-weight:700; color:var(--sub);}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--paper);}
.grouphd{display:flex; justify-content:space-between; padding:12px 20px;
  border-bottom:1px solid var(--ink); font-size:15px; font-weight:700;}
.grouphd .n{font-family:var(--mono); font-weight:400; color:var(--sub);}
.namerow{display:flex; justify-content:space-between; align-items:center;
  padding:0 20px; min-height:52px; border-bottom:1px solid var(--hair); font-size:16px;}
.namerow .tm{font-family:var(--mono); font-size:12px; color:var(--sub);}

/* ---------- 座席表の読み込み（STEP 1・2）。ここだけスクロールする ---------- */
#setup{padding:24px 20px 56px; max-width:620px; margin:0 auto;}
#setup h1{font-size:19px; margin:0 0 4px;}
#setup .sub{font-size:13px; color:var(--sub); margin:0 0 24px;}
.step{border:1px solid var(--ink); padding:16px; margin-bottom:16px;}
.stepno{display:block; font-family:var(--mono); font-size:11px; color:var(--sub); letter-spacing:.14em; margin-bottom:6px;}
.step h2{font-size:15px; margin:0 0 10px;}
#file{width:100%; font-size:13px; padding:10px; border:1px solid var(--hair); background:var(--rowpress);}
#sheetsel{width:100%; font-size:15px; padding:10px; border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:var(--sans);}
.hint{font-size:13px; color:var(--sub); margin:8px 0 0;}
.warn{border-left:3px solid var(--ink); padding-left:12px; font-size:13px; margin-top:14px;}
.tablebox{overflow-x:auto; margin-top:12px;}
table{border-collapse:collapse; width:100%; font-size:13px;}
th,td{border:1px solid var(--hair); padding:7px 8px; text-align:left; vertical-align:top;}
th{background:var(--rowpress); white-space:nowrap;}
.names{color:var(--sub); font-size:12px;}
#save{height:56px; width:100%; background:var(--ink); color:#fff; font-size:16px; font-weight:700; margin-top:16px;}
#save[disabled]{background:var(--press);}
</style>
</head>
<body>

<!-- ========== 座席表の読み込み（STEP 1・2） ========== -->
<section id="setup">
  <h1>名札スキャン</h1>
  <p class="sub">はじめに、座席表を1回だけ読み込みます。次からはこの操作は要りません。</p>

  <div class="step">
    <span class="stepno">STEP 1</span>
    <h2>座席表のExcelを選ぶ</h2>
    <input type="file" id="file" accept=".xlsx,.xlsm,.xls,.csv">
    <p class="hint">ファイルはこの端末の中だけで開きます。どこにも送信されません。</p>
    <p class="hint" id="replacenote" hidden>座席表を入れ替えると、いままでの読み取り記録は消えます。</p>
  </div>

  <div class="step" id="step2" hidden>
    <span class="stepno">STEP 2</span>
    <h2>シートと列を確かめる</h2>
    <select id="sheetsel"></select>
    <div id="detect"></div>
    <button id="save" disabled>この内容で使う</button>
  </div>
</section>

<!-- ========== 作業画面（①〜④） ========== -->
<section id="work" data-state="pre" hidden>
  <header id="hd">
    <span id="hdleft"></span>
    <button id="menubtn" aria-label="メニュー">···</button>
  </header>

  <div id="cam">
    <video id="video" playsinline muted></video>
    <div id="camoff">CAMERA OFF</div>
    <div class="mask" id="m1"></div><div class="mask" id="m2"></div>
    <div class="mask" id="m3"></div><div class="mask" id="m4"></div>
    <div id="frame"><div id="scanline"></div></div>
    <div id="guide">枠の中に名前を入れる</div>
  </div>

  <div id="res">
    <!-- ① -->
    <div id="pre">
      <div class="ready">READY</div>
      <div class="lead">座席表は読み込み済みです。<br>カメラを起動すると、ここに列番号が出ます。</div>
      <div class="spacer"></div>
      <button id="startbtn">カメラを起動する</button>
      <div id="prenote" hidden></div>
    </div>
    <!-- ② -->
    <div id="live" hidden>
      <div class="colnum">—</div>
      <div class="total" id="totaltext"></div>
    </div>
    <!-- ③ -->
    <div id="hit" hidden>
      <div class="colnum"><span id="hitcol"></span><span class="unit">列</span></div>
      <div class="who" id="hitname"></div>
      <div class="prog" id="hitprog"></div>
    </div>
    <!-- ④ -->
    <div id="pick" hidden>
      <div class="lead" id="picklead"></div>
      <div class="rows" id="pickrows"></div>
      <div class="foot">どれでもなければ、そのまま次の名札へ</div>
    </div>
  </div>
</section>

<!-- ========== ⑤ 補助画面 ========== -->
<section id="sheet" hidden>
  <header>
    <span class="ttl" id="sheettitle"></span>
    <button id="sheetclose">閉じる</button>
  </header>
  <div id="sheetbody"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const STORE = 'nafuda.roster.v1';

/* ===================== 文字の正規化 ===================== */
function norm(s){
  return String(s).normalize('NFKC')
    .replace(/[ 　\s]/g,'')
    .replace(/[|｜/／,、.。・:：;；\-–—_]/g,'')
    .replace(/(さん|様|君|くん)$/,'').trim();
}
const NOT_NAME = /^(スクリーン|発表台|入口|出口|受付|司会進行役|発表者用テーブル|スタッフ用|欠席者?|空席|予備|合計|備考|以上|←|→|↑|↓)$/;
const SENTENCE = /(です|ます|ください|お願い|しま[すし]|注意|の方|から|まで)/;
function looksLikeName(v){
  if (v === null || v === undefined || typeof v === 'number') return false;
  const t = norm(v);
  if (t.length < 2 || t.length > 14) return false;
  if (NOT_NAME.test(t) || SENTENCE.test(t)) return false;
  if (/^[0-9A-Za-z]+$/.test(t)) return false;
  if (!/[぀-ヿ一-鿿]/.test(t)) return false;
  return true;
}
function splitNames(v){
  const raw = String(v).normalize('NFKC').replace(/ /g,'').trim();
  const parts = raw.split(/[\/／]+/).map(s=>s.trim()).filter(Boolean);
  const ok = parts.filter(looksLikeName);
  return ok.length >= 2 ? ok : [raw];
}

/* ===================== Excel → 列ごとの名簿 ===================== */
function buildRoster(ws){
  const ref = ws['!ref']; if(!ref) return null;
  const R = XLSX.utils.decode_range(ref);
  const cell = (r,c) => { const x = ws[XLSX.utils.encode_cell({r,c})]; return x ? x.v : null; };

  /* 方式A：1行1人の表 */
  for (let r = R.s.r; r <= Math.min(R.s.r + 12, R.e.r); r++){
    let nameCol = -1, colCol = -1;
    for (let c = R.s.c; c <= R.e.c; c++){
      const v = cell(r,c); if (v == null) continue;
      const t = String(v).normalize('NFKC').replace(/\s/g,'');
      if (nameCol < 0 && /^(氏名|名前|参加者|お名前|会員名)$/.test(t)) nameCol = c;
      if (colCol  < 0 && /^(列|列番号|テーブル|机|島|グループ|班|席列)$/.test(t)) colCol = c;
    }
    if (nameCol >= 0 && colCol >= 0){
      const groups = new Map();
      for (let rr = r+1; rr <= R.e.r; rr++){
        const nm = cell(rr,nameCol), gv = cell(rr,colCol);
        if (!looksLikeName(nm) || gv == null) continue;
        const key = String(gv).normalize('NFKC').trim();
        if (!groups.has(key)) groups.set(key, []);
        splitNames(nm).forEach(x => groups.get(key).push(x));
      }
      if (groups.size >= 2)
        return { mode:'表形式', groups:[...groups.entries()].map(([label,names]) => ({label,names,on:true})) };
    }
  }

  /* 方式B：セルの位置が席の位置 */
  const byCol = new Map();
  for (let c = R.s.c; c <= R.e.c; c++){
    const names = [];
    for (let r = R.s.r; r <= R.e.r; r++){
      const v = cell(r,c);
      if (looksLikeName(v)) splitNames(v).forEach(x => names.push(x));
    }
    if (names.length >= 3) byCol.set(c, names);
  }
  if (!byCol.size) return null;
  const cols = [...byCol.keys()].sort((a,b)=>a-b);
  const blocks = [[cols[0]]];
  for (let i=1;i<cols.length;i++){
    if (cols[i] === cols[i-1]+1) blocks[blocks.length-1].push(cols[i]);
    else blocks.push([cols[i]]);
  }
  return { mode:'レイアウト形式', groups: blocks.map((b,i) => ({
    label:String(i+1),
    cols:b.map(c=>XLSX.utils.encode_col(c)).join('・'),
    names:b.flatMap(c=>byCol.get(c)), on:true })) };
}

/* ===================== あいまい照合 ===================== */
let ROSTER = [], IDF = new Map();
function buildIdf(){
  IDF = new Map();
  const N = ROSTER.length || 1, df = new Map();
  for (const p of ROSTER) for (const ch of new Set(p.k)) df.set(ch,(df.get(ch)||0)+1);
  for (const [ch,n] of df) IDF.set(ch, Math.log(N/n) + 0.5);
}
const MAXIDF = () => Math.log(ROSTER.length||1) + 0.5;
const idf = ch => IDF.has(ch) ? IDF.get(ch) : MAXIDF();
const bigrams = s => { const o=[]; for(let i=0;i<s.length-1;i++) o.push(s.slice(i,i+2)); return o; };
function dice(a,b){
  if(!a.length||!b.length) return 0;
  const m=new Map(); a.forEach(x=>m.set(x,(m.get(x)||0)+1));
  let h=0; b.forEach(x=>{const n=m.get(x)||0; if(n>0){h++; m.set(x,n-1);} });
  return 2*h/(a.length+b.length);
}
function diceWeighted(q,t){
  const m=new Map(); for(const ch of q) m.set(ch,(m.get(ch)||0)+1);
  let hit=0;
  for(const ch of t){ const n=m.get(ch)||0; if(n>0){ hit+=idf(ch); m.set(ch,n-1); } }
  let sq=0, st=0;
  for(const ch of q) sq+=idf(ch);
  for(const ch of t) st+=idf(ch);
  return (sq+st) ? 2*hit/(sq+st) : 0;
}
function score(q,t){
  const short = Math.min(q.length,t.length) <= 3;
  const wc = short ? 0.78 : 0.55;
  let s = wc*diceWeighted(q,t) + (1-wc)*dice(bigrams(q),bigrams(t));
  if (q[0] && q[0]===t[0]) s += 0.06;
  return Math.min(s,1);
}
const AUTO_MIN = 0.60, AUTO_GAP = 0.12, CAND_MIN = 0.38;
function rank(raw){
  const q = norm(raw);
  if (q.length < 2) return null;
  const all = ROSTER.map(p => ({p, s:score(q,p.k)})).sort((a,b)=>b.s-a.s);
  const top = all.slice(0,3).filter(x => x.s >= CAND_MIN);
  if (!top.length) return null;
  const decided = top.length === 1 || (top[0].s >= AUTO_MIN && top[0].s - top[1].s >= AUTO_GAP);
  return { decided, list: top.map(x => ({ name:x.p.n, group:x.p.g })) };
}

/* ===================== 座席表の読み込み ===================== */
let WB = null, CURRENT = null;

$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  WB = XLSX.read(await f.arrayBuffer(), {type:'array'});
  const sel = $('sheetsel'); sel.innerHTML = '';
  WB.SheetNames.forEach(n => { const o=document.createElement('option'); o.value=o.textContent=n; sel.appendChild(o); });
  let best = WB.SheetNames[0], bc = -1;
  for (const n of WB.SheetNames){
    const r = buildRoster(WB.Sheets[n]);
    const c = r ? r.groups.reduce((a,g)=>a+g.names.length,0) : -1;
    if (c > bc){ bc = c; best = n; }
  }
  sel.value = best;
  $('step2').hidden = false;
  showSheet();
});
$('sheetsel').addEventListener('change', showSheet);

function showSheet(){
  CURRENT = buildRoster(WB.Sheets[$('sheetsel').value]);
  const host = $('detect');
  if(!CURRENT){
    host.innerHTML = '<p class="warn">このシートからは席を見つけられませんでした。別のシートを選んでください。</p>';
    $('save').disabled = true; return;
  }
  host.innerHTML = `
    <p class="hint" style="margin-top:14px">読み取り方式：<b>${CURRENT.mode}</b>。${CURRENT.groups.length}個のまとまりが見つかりました。</p>
    <div class="tablebox"><table>
      <tr><th>使う</th><th>列</th><th>人数</th><th>入っている人（先頭だけ）</th></tr>
      ${CURRENT.groups.map((g,i)=>`<tr>
        <td><input type="checkbox" data-i="${i}" checked></td>
        <td><b>${g.label}</b>${g.cols?`<div class="names">${g.cols}</div>`:''}</td>
        <td>${g.names.length}人</td>
        <td class="names">${g.names.slice(0,4).join('、')}${g.names.length>4?' …':''}</td></tr>`).join('')}
    </table></div>
    <p class="warn">席ではないまとまり（欠席者の一覧など）が混ざっていたら、左のチェックを外してください。</p>`;
  host.querySelectorAll('input[type=checkbox]').forEach(cb =>
    cb.addEventListener('change', () => { CURRENT.groups[+cb.dataset.i].on = cb.checked; }));
  $('save').disabled = false;
}

$('save').addEventListener('click', () => {
  const used = CURRENT.groups.filter(g=>g.on), people = [];
  used.forEach((g,i) => g.names.forEach(n => people.push([n, g.label || String(i+1)])));
  const payload = { v:1, t:$('sheetsel').value, p:people };
  try { localStorage.setItem(STORE, JSON.stringify(payload)); } catch(e){}
  SEEN.clear();
  boot(payload);
});

/* ===================== 作業画面 ===================== */
let SEEN = new Map();          // 名前 → { g:列, t:'14:32' }
let RECENT = [], SHOWN = null, PICKTOP = null;
let BUSY = false, WORKER = null, TITLE = '';

function setState(s){ $('work').dataset.state = s;
  $('pre').hidden = s !== 'pre';
  $('live').hidden = s !== 'scan';
  $('hit').hidden = s !== 'hit';
  $('pick').hidden = s !== 'pick';
}
function colsOf(){ return [...new Set(ROSTER.map(p=>p.g))]; }
function headerText(){
  return $('work').dataset.state === 'pre'
    ? `${TITLE} · ${ROSTER.length}人 · ${colsOf().length}列`
    : `読取 ${SEEN.size}`;
}
function refreshHeader(){ $('hdleft').textContent = headerText(); }

function boot(payload){
  TITLE = payload.t;
  ROSTER = payload.p.map(([n,g]) => ({ n, g, k:norm(n) }));
  buildIdf();
  $('setup').hidden = true;
  $('work').hidden = false;
  document.body.classList.add('work');
  setState('pre');
  refreshHeader();
  layoutMasks();
}

/* 枠外の黒ベタ4枚を、枠の位置に合わせて置く */
function layoutMasks(){
  const pick = $('work').dataset.state === 'pick';
  const top = pick ? 95 : 165, h = 150, side = 22;
  $('m1').style.cssText = `left:0;right:0;top:0;height:${top}px;`;
  $('m2').style.cssText = `left:0;right:0;top:${top+h}px;bottom:0;`;
  $('m3').style.cssText = `left:0;width:${side}px;top:${top}px;height:${h}px;`;
  $('m4').style.cssText = `right:0;width:${side}px;top:${top}px;height:${h}px;`;
  $('guide').style.top = (top + h + 16) + 'px';
}

/* --- カメラと文字認識の準備 --- */
$('startbtn').addEventListener('click', start);
function preNote(msg, keepDisabled){
  $('startbtn').hidden = true; $('prenote').hidden = false; $('prenote').textContent = msg;
  if (!keepDisabled){ $('startbtn').hidden = false; $('startbtn').disabled = false; $('prenote').hidden = true; }
}
async function start(){
  $('startbtn').disabled = true;
  $('startbtn').hidden = true; $('prenote').hidden = false;
  $('prenote').textContent = 'カメラを準備しています…';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }, audio:false });
    $('video').srcObject = stream; await $('video').play();
  }catch(e){
    $('prenote').hidden = true; $('startbtn').hidden = false; $('startbtn').disabled = false;
    $('prenote').hidden = false; $('prenote').textContent = 'カメラを使えませんでした：' + e.message;
    return;
  }
  $('prenote').textContent = '文字を読む準備をしています…';
  try{
    WORKER = await Tesseract.createWorker('jpn', 1, {
      workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
      corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
      langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/jpn@1.0.0/4.0.0_best_int'
    });
    await WORKER.setParameters({ tessedit_pageseg_mode:'7', preserve_interword_spaces:'0' });
  }catch(e){
    $('prenote').textContent = '文字認識の準備に失敗しました：' + e.message;
    $('startbtn').hidden = false; $('startbtn').disabled = false;
    return;
  }
  setState('scan'); layoutMasks(); refreshHeader(); updateTotal();
  loop();
}

function updateTotal(){ $('totaltext').textContent = `合計 ${SEEN.size} / ${ROSTER.length} 枚`; }

function grab(){
  const v = $('video'); if(!v.videoWidth) return null;
  const cam = $('cam').getBoundingClientRect();
  const fr  = $('frame').getBoundingClientRect();
  /* 画面上の読取枠が、映像のどこに当たるかを求める（object-fit: cover） */
  const scale = Math.max(cam.width / v.videoWidth, cam.height / v.videoHeight);
  const dw = v.videoWidth * scale, dh = v.videoHeight * scale;
  const ox = (cam.width - dw) / 2, oy = (cam.height - dh) / 2;
  const sx = ((fr.left - cam.left) - ox) / scale;
  const sy = ((fr.top  - cam.top ) - oy) / scale;
  const sw = fr.width / scale, sh = fr.height / scale;
  if (sw <= 0 || sh <= 0) return null;
  const cw = 760, ch = Math.max(1, Math.round(cw*sh/sw));
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d', {willReadFrequently:true});
  g.drawImage(v, sx, sy, sw, sh, 0, 0, cw, ch);
  const d = g.getImageData(0,0,cw,ch), a = d.data;
  for(let i=0;i<a.length;i+=4){
    const y = 0.299*a[i] + 0.587*a[i+1] + 0.114*a[i+2];
    const t = y < 110 ? 0 : (y > 165 ? 255 : (y-110)*255/55);
    a[i]=a[i+1]=a[i+2]=t;
  }
  g.putImageData(d,0,0);
  return cv;
}

let RAWTEXT = '';   // 開発用。作業画面には出さない
async function loop(){
  if(!BUSY){
    BUSY = true;
    try{
      const cv = grab();
      if(cv){
        const { data } = await WORKER.recognize(cv);
        const line = (data.text||'').split('\n').map(s=>s.trim()).filter(Boolean)[0] || '';
        RAWTEXT = line;
        const r = rank(line);
        const top = r ? r.list[0].name : null;
        RECENT.push(top); if (RECENT.length > 5) RECENT.shift();
        if (r && RECENT.filter(x => x === top).length >= 2){
          if (r.decided){ if (top !== SHOWN) showHit(r.list[0]); }
          else { if (top !== PICKTOP) showPick(r.list); }
        }
      }
    }catch(e){ /* 1コマ失敗しても続ける */ }
    BUSY = false;
  }
  setTimeout(loop, 120);
}

function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function showHit(m, silent){
  const again = SEEN.has(m.name);
  if (!again) SEEN.set(m.name, { g:m.group, t:nowHM() });
  SHOWN = m.name; PICKTOP = null;
  const done  = [...SEEN.values()].filter(x => x.g === m.group).length;
  const total = ROSTER.filter(p => p.g === m.group).length;
  $('hitcol').textContent  = m.group;
  $('hitname').textContent = m.name;
  $('hitprog').innerHTML   = `${m.group}列：${done} / ${total} 枚目` + (again ? '<span class="done">済</span>' : '');
  setState('hit'); layoutMasks(); refreshHeader(); updateTotal();
  if (!again && !silent && navigator.vibrate) navigator.vibrate(60);
}
function showPick(list){
  PICKTOP = list[0].name; SHOWN = null;
  $('picklead').textContent = list.length >= 2 ? `${list.length}人が近い — どれですか` : 'この人で合っていますか';
  $('pickrows').innerHTML = list.map((c,i) =>
    `<button class="cand" data-i="${i}"><span class="nm">${c.name}</span><span class="cl">${c.group}<span>列</span></span></button>`).join('');
  $('pickrows').querySelectorAll('.cand').forEach(b =>
    b.addEventListener('click', () => showHit(list[+b.dataset.i])));
  setState('pick'); layoutMasks(); refreshHeader();
  if (navigator.vibrate) navigator.vibrate([30,60,30]);
}

/* ===================== ⑤ 補助画面 ===================== */
function openSheet(title, html, after){
  $('sheettitle').textContent = title;
  $('sheetbody').innerHTML = html;
  $('sheet').hidden = false;
  if (after) after();
}
$('sheetclose').addEventListener('click', () => { $('sheet').hidden = true; });
$('menubtn').addEventListener('click', openMenu);

function openMenu(){
  openSheet('メニュー', `
    <button class="menurow" id="mSearch">
      <span><span class="t">名前を打って探す</span><span class="s">読み取れない名札のとき</span></span>
      <span class="arrow">→</span></button>
    <button class="menurow" id="mList">
      <span><span class="t">読み取った名札の一覧</span><span class="s">今 ${SEEN.size} 枚 · 列ごとの残りも確認</span></span>
      <span class="arrow">→</span></button>
    <button class="menurow" id="mSwap">
      <span><span class="t">座席表を入れ替える</span><span class="s">いま：${TITLE} / ${ROSTER.length}人</span></span>
      <span class="arrow">→</span></button>
    <p class="note">この座席表は端末の中だけに保存されています。サーバーへは送られていません。</p>
    <button class="blockbtn" id="mClear">読み取り記録を消す</button>
    <button class="blockbtn" id="mRaw" style="border-color:var(--hair);color:var(--sub);font-size:13px;height:44px;">
      開発用：いま読めている文字</button>
  `, () => {
    $('mSearch').onclick = openSearch;
    $('mList').onclick   = openList;
    $('mSwap').onclick   = swapRoster;
    $('mClear').onclick  = () => { SEEN.clear(); refreshHeader(); updateTotal(); openMenu(); };
    $('mRaw').onclick    = () => { $('mRaw').textContent = '読めている文字：' + (RAWTEXT || '—'); };
  });
}

function openSearch(){
  openSheet('名前で探す', `
    <input type="text" id="q" placeholder="例：しんかわ" autocomplete="off">
    <p class="qhint">姓だけ・ひらがなでも当たります</p>
    <div id="qout"></div>
    <p class="note">選ぶと、その人を読み取り済みにしてカメラへ戻ります。</p>
  `, () => {
    $('q').focus();
    $('q').addEventListener('input', e => {
      const q = norm(e.target.value);
      if (!q){ $('qout').innerHTML = ''; return; }
      const hits = ROSTER.map(p => ({p, s:score(q,p.k)})).sort((a,b)=>b.s-a.s).slice(0,5).filter(x=>x.s>0.2);
      $('qout').innerHTML = hits.map((x,i) =>
        `<button class="hitrow" data-i="${i}"><span class="nm">${x.p.n}</span><span class="cl">${x.p.g}<span>列</span></span></button>`).join('')
        || '<p class="qhint">見つかりませんでした。</p>';
      $('qout').querySelectorAll('.hitrow').forEach(b => b.addEventListener('click', () => {
        const p = hits[+b.dataset.i].p;
        $('sheet').hidden = true;
        showHit({ name:p.n, group:p.g }, true);
      }));
    });
  });
}

function listHTML(mode){
  if (!SEEN.size) return '<p class="note">まだ1枚も読み取っていません。</p>';
  if (mode === 'order'){
    return [...SEEN.entries()].reverse().map(([n,v]) =>
      `<div class="namerow"><span>${n}</span><span class="tm">${v.g}列 · ${v.t}</span></div>`).join('');
  }
  const cols = colsOf().filter(g => [...SEEN.values()].some(v => v.g === g));
  return cols.map(g => {
    const done  = [...SEEN.values()].filter(v => v.g === g).length;
    const total = ROSTER.filter(p => p.g === g).length;
    const rows = [...SEEN.entries()].filter(([,v]) => v.g === g)
      .map(([n,v]) => `<div class="namerow"><span>${n}</span><span class="tm">${v.t}</span></div>`).join('');
    return `<div class="grouphd"><span>${g}列</span><span class="n">${done} / ${total}</span></div>${rows}`;
  }).join('');
}
function openList(){
  openSheet(`読み取った名札 ${SEEN.size}`, `
    <div class="tabs">
      <button id="tCol" aria-selected="true">列ごと</button>
      <button id="tOrd" aria-selected="false">読んだ順</button>
    </div>
    <div id="listbody">${listHTML('col')}</div>
    <p class="note">袋詰めの最後に「16 / 16」だけを見て、列ごとの枚数を確認します。</p>
  `, () => {
    const set = m => {
      $('tCol').setAttribute('aria-selected', String(m==='col'));
      $('tOrd').setAttribute('aria-selected', String(m==='order'));
      $('listbody').innerHTML = listHTML(m);
    };
    $('tCol').onclick = () => set('col');
    $('tOrd').onclick = () => set('order');
  });
}

function swapRoster(){
  try { localStorage.removeItem(STORE); } catch(e){}
  location.reload();
}

/* ===================== 起動 ===================== */
(function init(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch(e){}
  if (saved && saved.p && saved.p.length){ boot(saved); }
  else { $('replacenote').hidden = true; }
})();
window.addEventListener('resize', layoutMasks);
</script>
</body>
